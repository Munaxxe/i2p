<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 440" role="img" aria-label="Bill of materials for the bedroom light">
<style>
text{font-family:system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#c3d5e1;font-size:11.5px}
.b{fill:#43B3E7}.w{fill:#fff}.h{font-weight:700}
</style>
<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#43B3E7" stroke-opacity=".08"/></pattern></defs>
<rect width="704" height="440" fill="#06121b"/><rect width="704" height="440" fill="url(#grid)"/>
<text x="24" y="30" class="b h" style="font-size:13px">BILL OF MATERIALS · Bedroom light</text>
<rect x="24" y="44" width="656" height="30" rx="6" fill="#43B3E7" fill-opacity=".16"/>
<text x="38" y="63" class="b h" style="font-size:10px">REF</text><text x="96" y="63" class="b h" style="font-size:10px">PART</text><text x="372" y="63" class="b h" style="font-size:10px">SPECIFICATION</text><text x="664" y="63" text-anchor="end" class="b h" style="font-size:10px">QTY</text>

<g stroke="#2a4a5e"><line x1="24" y1="118" x2="680" y2="118"/><line x1="24" y1="162" x2="680" y2="162"/><line x1="24" y1="206" x2="680" y2="206"/><line x1="24" y1="250" x2="680" y2="250"/><line x1="24" y1="294" x2="680" y2="294"/><line x1="24" y1="338" x2="680" y2="338"/><line x1="24" y1="382" x2="680" y2="382"/></g>

<text x="38" y="102" class="b h">U1</text><text x="96" y="102" class="w">Controller board · ESP32-C3</text><text x="372" y="102">Wi-Fi + Bluetooth, 3.3 V logic</text><text x="664" y="102" text-anchor="end" class="w">1</text>
<text x="38" y="146" class="b h">S1</text><text x="96" y="146" class="w">PIR motion sensor · HC-SR501</text><text x="372" y="146">5 V supply, ~7 m range, 110°</text><text x="664" y="146" text-anchor="end" class="w">1</text>
<text x="38" y="190" class="b h">S2</text><text x="96" y="190" class="w">Light sensor · LDR + 10 kΩ</text><text x="372" y="190">analog light level</text><text x="664" y="190" text-anchor="end" class="w">1</text>
<text x="38" y="234" class="b h">K1</text><text x="96" y="234" class="w">Relay module · 1 channel</text><text x="372" y="234">5 V coil, 10 A / 250 V AC</text><text x="664" y="234" text-anchor="end" class="w">1</text>
<text x="38" y="278" class="b h">PS1</text><text x="96" y="278" class="w">Power module · HLK-PM01</text><text x="372" y="278">230 V AC in, 5 V DC out</text><text x="664" y="278" text-anchor="end" class="w">1</text>
<text x="38" y="322" class="b h">TB1</text><text x="96" y="322" class="w">Screw terminal block · 3-way</text><text x="372" y="322">mains in, neutral, lamp out</text><text x="664" y="322" text-anchor="end" class="w">1</text>
<text x="38" y="366" class="b h">ENC</text><text x="96" y="366" class="w">Wall enclosure · ABS</text><text x="372" y="366">150 × 100 × 70 mm</text><text x="664" y="366" text-anchor="end" class="w">1</text>

<text x="24" y="408">7 line items · illustrative list for this example</text>
<text x="24" y="424">Always confirm ratings with a supplier. Mains wiring: qualified electrician only.</text>
