<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 704 440" role="img" aria-label="Isometric view of the finished wall-mounted bedroom sensor box with dimensions">
<style>
text{font-family:system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#c3d5e1;font-size:11px}
.b{fill:#43B3E7}.w{fill:#fff}.h{font-weight:700}
.d{fill:none;stroke:#5f7f93;stroke-width:1}
.l{fill:none;stroke:#43B3E7;stroke-width:1.4;stroke-linecap:round}
</style>
<defs>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#43B3E7" stroke-opacity=".08"/></pattern>


</defs>
<rect width="704" height="440" fill="#06121b"/><rect width="704" height="440" fill="url(#grid)"/>

<g transform="translate(67 20)">
  <!-- wall -->
  <polygon points="186,162.5 446,312.5 446,102.5 186,-47.5" fill="#0a1b28" stroke="#2a4a5e"/>
  <g stroke="#43B3E7" stroke-opacity=".1">
    <line x1="186" y1="137.5" x2="446" y2="287.5"/><line x1="186" y1="112.5" x2="446" y2="262.5"/><line x1="186" y1="87.5" x2="446" y2="237.5"/>
    <line x1="186" y1="62.5" x2="446" y2="212.5"/><line x1="186" y1="37.5" x2="446" y2="187.5"/><line x1="186" y1="12.5" x2="446" y2="162.5"/>
  </g>
  <!-- cuboid -->
  <polygon points="320,210 190,135 251,100 381,175" fill="#1d4660" stroke="#43B3E7" stroke-width="1.4"/>
  <polygon points="320,310 190,235 190,135 320,210" fill="#12303f" stroke="#43B3E7" stroke-width="1.6"/>
  <polygon points="320,310 381,275 381,175 320,210" fill="#0b1e2b" stroke="#43B3E7" stroke-width="1.4"/>
  <!-- top vents -->
  <g stroke="#43B3E7" stroke-opacity=".6"><line x1="300" y1="170" x2="340" y2="193"/><line x1="292" y1="164" x2="332" y2="187"/><line x1="284" y1="158" x2="324" y2="181"/></g>

  <!-- front face artwork (150 x 100) -->
  <g transform="matrix(0.8667 0.5 0 1 190 135)">
    <rect x="6" y="6" width="138" height="88" rx="6" fill="none" stroke="#43B3E7" stroke-opacity=".35"/>
    <circle cx="75" cy="40" r="26" fill="#0a2a3c" stroke="#43B3E7" stroke-width="1.5"/>
    <circle cx="75" cy="40" r="20" fill="#2a6f93" stroke="#43B3E7" stroke-opacity=".7"/>
    <g stroke="#fff" stroke-opacity=".35"><line x1="75" y1="20" x2="75" y2="60"/><line x1="55" y1="40" x2="95" y2="40"/><line x1="61" y1="26" x2="89" y2="54"/><line x1="89" y1="26" x2="61" y2="54"/></g>
    <circle cx="22" cy="16" r="3.2" fill="#04101a" stroke="#43B3E7"/>
    <circle cx="128" cy="16" r="4.5" fill="#5eff9a"><animate attributeName="opacity" values="1;.25;1" dur="1.6s" repeatCount="indefinite"/></circle>
    <rect x="38" y="74" width="74" height="14" rx="3" fill="#04101a" stroke="#43B3E7" stroke-opacity=".5"/>
    <text x="75" y="84" text-anchor="middle" class="b" style="font-size:8px">i2P · BEDROOM</text>
    <circle cx="14" cy="86" r="2.5" fill="#5f7f93"/><circle cx="136" cy="86" r="2.5" fill="#5f7f93"/>
  </g>
  <!-- side face artwork (70 x 100) -->
  <g transform="matrix(0.866 -0.5 0 1 320 210)">
    <circle cx="35" cy="80" r="8" fill="#04101a" stroke="#43B3E7" stroke-width="1.4"/>
    <circle cx="35" cy="80" r="3.5" fill="none" stroke="#5f7f93"/>
    <text x="35" y="58" text-anchor="middle" class="b" style="font-size:8px">230 V</text>
  </g>

  <!-- dimensions -->
  <g class="d">
    <line x1="320" y1="332" x2="190" y2="257"/><line x1="320" y1="326" x2="320" y2="338"/><line x1="190" y1="251" x2="190" y2="263"/>
    <line x1="172" y1="135" x2="172" y2="235"/><line x1="166" y1="135" x2="178" y2="135"/><line x1="166" y1="235" x2="178" y2="235"/>
    <line x1="320" y1="332" x2="381" y2="297"/><line x1="381" y1="291" x2="381" y2="303"/>
  </g>
  <text x="255" y="298" text-anchor="middle" transform="rotate(30 255 298)" class="w" style="font-size:10px">150 mm</text>
  <text x="160" y="190" text-anchor="middle" transform="rotate(-90 160 190)" class="w" style="font-size:10px">100 mm</text>
  <text x="358" y="322" text-anchor="middle" transform="rotate(-30 358 322)" class="w" style="font-size:10px">70 mm</text>

  <!-- callouts -->
  <path class="d" d="M240 214 L150 198"/><circle cx="240" cy="214" r="2.5" class="b"/>
  <text x="2" y="194" class="b h">PIR lens</text><text x="2" y="208">detects movement</text>
  <path class="d" d="M209 161 L150 118"/><circle cx="209" cy="161" r="2.5" class="b"/>
  <text x="2" y="114" class="b h">Light sensor</text><text x="2" y="128">knows when it is dark</text>
  <path class="d" d="M301 215 L430 168"/><circle cx="301" cy="215" r="2.5" class="b"/>
  <text x="434" y="164" class="b h">Status LED</text><text x="434" y="178">green = connected</text>
  <path class="d" d="M357 282 L430 302"/><circle cx="357" cy="282" r="2.5" class="b"/>
  <text x="434" y="306" class="b h">Cable entry</text><text x="434" y="320">mains in / lamp out</text>
</g>
<text x="690" y="430" text-anchor="end" style="font-size:10.5px">DWG 05 · FINAL DEVICE (CLOSED) · ILLUSTRATIVE</text>
</svg>
