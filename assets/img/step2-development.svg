<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 704 440" role="img" aria-label="Idea development: inputs, processes and outputs for the bedroom light">
<style>
text{font-family:system-ui,"Segoe UI","Helvetica Neue",Arial,sans-serif;fill:#c3d5e1;font-size:10.5px}
.b{fill:#43B3E7}.w{fill:#fff}.h{font-weight:700}
.l{fill:none;stroke:#43B3E7;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.d{fill:none;stroke:#5f7f93;stroke-width:1}
.f{fill:#43B3E7;fill-opacity:.1;stroke:#43B3E7;stroke-width:1.4}
.p{fill:#0a1d2a;stroke:#2a4a5e;stroke-width:1.2}
</style>
<defs>
<pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#43B3E7" stroke-opacity=".08"/></pattern>
<marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#43B3E7"/></marker>
</defs>
<rect width="704" height="440" fill="#06121b"/><rect width="704" height="440" fill="url(#grid)"/>

<text x="20" y="26" class="b h" style="font-size:12px">INPUT</text><text x="62" y="26">what it senses</text>
<text x="254" y="26" class="b h" style="font-size:12px">PROCESS</text><text x="324" y="26">how it decides</text>
<text x="494" y="26" class="b h" style="font-size:12px">OUTPUT</text><text x="552" y="26">what it produces</text>

<!-- INPUTS -->
<rect x="20" y="40" width="190" height="80" rx="8" class="p"/>
<text x="34" y="62" class="b h">PIR MOTION SENSOR</text>
<text x="34" y="82" class="w">type: digital (0 / 1)</text>
<text x="34" y="100">“someone is here”</text>
<path class="l" d="M150 108 H162 V96 H180 V108 H196" style="stroke-width:1.2"/>

<rect x="20" y="132" width="190" height="80" rx="8" class="p"/>
<text x="34" y="154" class="b h">LIGHT SENSOR (LDR)</text>
<text x="34" y="174" class="w">type: analog 0 to 4095</text>
<text x="34" y="192">“how dark is it”</text>
<path class="l" d="M150 200 q8 -10 16 0 t16 0 t16 0" style="stroke-width:1.2"/>

<rect x="20" y="224" width="190" height="80" rx="8" class="p"/>
<text x="34" y="246" class="b h">PHONE COMMAND</text>
<text x="34" y="266" class="w">type: text over Wi-Fi</text>
<text x="34" y="284">“ON” · “OFF” · “AUTO”</text>

<!-- PROCESS -->
<rect x="254" y="40" width="190" height="264" rx="10" class="f"/>
<text x="268" y="62" class="b h">CONTROLLER · ESP32-C3</text>
<line x1="268" y1="72" x2="430" y2="72" class="d"/>
<text x="268" y="92">ALGORITHM</text>
<text x="268" y="118" class="w" style="font-size:12px">IF   motion = 1</text>
<text x="268" y="138" class="w" style="font-size:12px">AND  light  &lt; 800</text>
<text x="268" y="158" class="w" style="font-size:12px">THEN lamp = ON</text>
<text x="268" y="178" class="w" style="font-size:12px">     hold 5 min</text>
<text x="268" y="198" class="w" style="font-size:12px">ELSE lamp = OFF</text>
<text x="268" y="224" class="b" style="font-size:11px">phone command overrides</text>
<rect x="268" y="244" width="76" height="40" rx="6" class="p"/><text x="306" y="260" text-anchor="middle" class="b">TIMER</text><text x="306" y="275" text-anchor="middle">5 min</text>
<rect x="354" y="244" width="76" height="40" rx="6" class="p"/><text x="392" y="260" text-anchor="middle" class="b">WI-FI</text><text x="392" y="275" text-anchor="middle">phone link</text>

<!-- OUTPUTS -->
<rect x="494" y="40" width="190" height="80" rx="8" class="p"/>
<text x="508" y="62" class="b h">CIRCUIT</text>
<text x="508" y="82" class="w">wiring diagram + parts</text>
<path class="l" d="M508 102 H530 l4 -8 l6 16 l6 -16 l6 16 l4 -8 H590" style="stroke-width:1.2"/>

<rect x="494" y="132" width="190" height="80" rx="8" class="p"/>
<text x="508" y="154" class="b h">3D MODEL</text>
<text x="508" y="174" class="w">device + room, rotatable</text>
<polygon points="620,186 636,194 636,206 620,198" class="f" style="stroke-width:1"/>
<polygon points="620,186 636,194 652,186 636,178" class="f" style="stroke-width:1"/>
<polygon points="636,194 652,186 652,198 636,206" class="f" style="stroke-width:1"/>

<rect x="494" y="224" width="190" height="80" rx="8" class="p"/>
<text x="508" y="246" class="b h">REAL-TIME VIEW</text>
<text x="508" y="266" class="w">updates as you edit</text>
<circle cx="660" cy="240" r="4" fill="#5eff9a"><animate attributeName="opacity" values="1;.2;1" dur="1.4s" repeatCount="indefinite"/></circle>
<text x="508" y="284">LIVE</text>

<!-- arrows -->
<g class="l" marker-end="url(#ar)" stroke-dasharray="4 3">
  <path d="M210 80 H254" marker-end="url(#ar)"/><path d="M210 172 H254" marker-end="url(#ar)"/><path d="M210 264 H254" marker-end="url(#ar)"/>
  <path d="M444 80 H494" marker-end="url(#ar)"/><path d="M444 172 H494" marker-end="url(#ar)"/><path d="M444 264 H494" marker-end="url(#ar)"/>
</g>

<!-- live trace -->
<rect x="20" y="322" width="664" height="100" rx="8" class="p"/>
<text x="34" y="340" class="b h">LIVE SIGNAL PREVIEW (simulated)</text>
<text x="34" y="364">PIR</text><text x="34" y="386">LIGHT</text><text x="34" y="408">LAMP</text>
<path class="l" style="stroke-width:1.3" d="M100 366 H200 V352 H290 V366 H450 V352 H500 V366 H670"/>
<path class="l" style="stroke-width:1.3;stroke:#ffb86b" d="M100 388 q12 -3 24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0 t24 0"/>
<path class="l" style="stroke-width:1.3;stroke:#5eff9a" d="M100 410 H206 V396 H350 V410 H456 V396 H560 V410 H670"/>
<line x1="100" y1="346" x2="100" y2="414" stroke="#fff" stroke-opacity=".6" stroke-width="1" stroke-dasharray="3 3">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="570 0" dur="7s" repeatCount="indefinite"/>
</line>
<text x="680" y="436" text-anchor="end" style="font-size:10.5px">DWG 02 · IDEA DEVELOPMENT · ILLUSTRATIVE</text>
</svg>
