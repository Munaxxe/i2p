<svg xmlns="http://www.w3.org/2000/svg" xml:space="preserve" viewBox="0 0 704 440" role="img" aria-label="Starter code for the bedroom light">
<style>
text{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12px;fill:#d6eefa;white-space:pre}
.c{fill:#6c8a9b}.k{fill:#43B3E7}.n{fill:#ffb86b}.s{fill:#8be28b}.g{fill:#4a6577;font-size:11px}
</style>
<defs><pattern id="grid" width="22" height="22" patternUnits="userSpaceOnUse"><path d="M22 0H0V22" fill="none" stroke="#43B3E7" stroke-opacity=".08"/></pattern></defs>
<rect width="704" height="440" fill="#06121b"/><rect width="704" height="440" fill="url(#grid)"/>
<rect x="16" y="14" width="672" height="400" rx="10" fill="#050b10" stroke="#1f3a4a"/>
<circle cx="36" cy="32" r="5" fill="#ff6b6b"/><circle cx="54" cy="32" r="5" fill="#ffd54a"/><circle cx="72" cy="32" r="5" fill="#5eff9a"/>
<text x="100" y="36" style="fill:#c3d5e1;font-size:11px">bedroom_light.ino</text>
<line x1="16" y1="48" x2="688" y2="48" stroke="#1f3a4a"/>

<g class="g">
<text x="34" y="68">1</text><text x="34" y="84">2</text><text x="34" y="101">3</text><text x="34" y="117">4</text><text x="34" y="134">5</text><text x="34" y="150">6</text><text x="34" y="167">7</text><text x="34" y="183">8</text><text x="34" y="200">9</text><text x="28" y="216">10</text><text x="28" y="233">11</text><text x="28" y="249">12</text><text x="28" y="266">13</text><text x="28" y="282">14</text><text x="28" y="299">15</text><text x="28" y="315">16</text><text x="28" y="332">17</text><text x="28" y="348">18</text><text x="28" y="365">19</text><text x="28" y="381">20</text><text x="28" y="398">21</text>
</g>
<text x="62" y="68" class="c">// Bedroom light: starter code (illustrative sample)</text>
<text x="62" y="84"><tspan class="k">#include</tspan> <tspan class="s">&lt;WiFi.h&gt;</tspan></text>
<text x="62" y="117"><tspan class="k">const int</tspan> PIR_PIN    = <tspan class="n">2</tspan>;     <tspan class="c">// motion sensor</tspan></text>
<text x="62" y="134"><tspan class="k">const int</tspan> LDR_PIN    = <tspan class="n">0</tspan>;     <tspan class="c">// light sensor</tspan></text>
<text x="62" y="150"><tspan class="k">const int</tspan> RELAY_PIN  = <tspan class="n">5</tspan>;     <tspan class="c">// switches the lamp</tspan></text>
<text x="62" y="167"><tspan class="k">const int</tspan> DARK_BELOW = <tspan class="n">800</tspan>;   <tspan class="c">// lower = darker = night</tspan></text>
<text x="62" y="183"><tspan class="k">const unsigned long</tspan> HOLD_MS = <tspan class="n">300000</tspan>; <tspan class="c">// stay on 5 min</tspan></text>
<text x="62" y="216"><tspan class="k">unsigned long</tspan> lastMotion = <tspan class="n">0</tspan>;</text>
<text x="62" y="233"><tspan class="k">bool</tspan> phoneOverride = <tspan class="k">false</tspan>;  <tspan class="c">// set by the phone app</tspan></text>
<text x="62" y="266"><tspan class="k">void</tspan> loop() {</text>
<text x="62" y="282">  <tspan class="k">bool</tspan> motion = digitalRead(PIR_PIN);</text>
<text x="62" y="299">  <tspan class="k">bool</tspan> isDark = analogRead(LDR_PIN) &lt; DARK_BELOW;</text>
<text x="62" y="315">  <tspan class="k">if</tspan> (motion &amp;&amp; isDark) lastMotion = millis();</text>
<text x="62" y="348">  <tspan class="k">bool</tspan> lampOn = phoneOverride ||</text>
<text x="62" y="365">      (lastMotion &amp;&amp; millis() - lastMotion &lt; HOLD_MS);</text>
<text x="62" y="381">  digitalWrite(RELAY_PIN, lampOn);</text>
<text x="62" y="398">}</text>
<text x="690" y="432" text-anchor="end" style="font-size:10.5px;fill:#c3d5e1">DWG 04C · CODE · ILLUSTRATIVE SAMPLE</text>
</svg>
